runs-on: windows-latest
steps:
  - uses: actions/checkout@v4
  - uses: actions/setup-python@v5
    with:
      python-version: "3.13"
  - run: pip install pygame-ce pyinstaller
  - run: pyinstaller --noconfirm --clean --windowed --name BattleCity --add-data "assets;assets" main.py
  - uses: actions/upload-artifact@v4
    with:
      name: BattleCity-windows
      path: dist/BattleCity
